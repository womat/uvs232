# Test, vet and build on every push and pull request.
#
# Actions are pinned to a commit SHA, with the release it belongs to in a
# comment, as in womat/tadl.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # The tests need no hardware: pkg/session plays the data logger. The device
  # tests in the module root are skipped without UVS232_PORT.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test with race detector
        run: go test -race ./...

      # Pinned rather than @latest, so a new release cannot turn CI red without a
      # change here, as in womat/tadl. dependabot does not see go install lines -
      # raise them by hand.
      - name: Install govulncheck and golangci-lint
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0

      # The default linters; there is no .golangci.yml.
      - name: golangci-lint
        run: $(go env GOPATH)/bin/golangci-lint run ./...

      # Exits non-zero when this code actually calls a vulnerable symbol.
      # Advisories that only sit in required modules are reported but do not
      # fail the build.
      - name: Vulnerability scan
        run: $(go env GOPATH)/bin/govulncheck ./...

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: arm
            goarm: "6"
          - goarch: arm64
            goarm: ""
    env:
      GOOS: linux
      GOARCH: ${{ matrix.goarch }}
      GOARM: ${{ matrix.goarm }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...
